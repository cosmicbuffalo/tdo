[package]
name = "tdo"
version = "0.1.0"
edition = "2024"
description = "A modal, Git-backed kanban board for the terminal"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
fs2 = "0.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tempfile = "3.20"
toml = "0.8"
tui-textarea = "0.7"
